[package]
name = "tui-file-downloader"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["dm-ui", "dm-core", "dm-net", "dm-providers"]
resolver = "3"

[dependencies]
anyhow = "1.0.104"
dm-core = { path = "dm-core" }
dm-ui = { path = "dm-ui" }
tokio = { version = "1.54.1", features = ["full"] }
